org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ── Target platform ──────────────────────────────────────────────────────────
# minecraft_version / minecraft_version_range / neo_version moved to versions/<target>.properties:
# pick a target with -Pmc=<id>; the default is set in build.gradle (ext.mcDefault).
loader_version_range=[1,)

# ── Your mod's identity (RENAME THESE — see README "Make it your own") ───────
mod_id=moddingfromamod
mod_name=Moddy the Wish Watch
mod_version=1.0.9
mod_group_id=com.moddingfromamod
mod_license=MPL-2.0
mod_authors=Moddy LLC
mod_description=Make a wish in Minecraft and Moddy the Wish Watch makes it come true. Single-player.

# true in the PUBLIC repo only (tools/public-tree.py), where a plain `./gradlew build` then makes the store
# jar: version <mod_version>+mc<minecraft_version> and the Apprentice's sentence model inside (build.gradle).
store_jar=true

# ── Optional features ────────────────────────────────────────────────────────
# GeckoLib: animation library for custom animated models. Flip to true to compile
# against it AND bundle it via JarJar (so the shipped jar is self-contained).
uses_geckolib=false
geckolib_version=5.5.6

# A WEBP DECODER, and nothing else. Java's own ImageIO cannot read WebP, and Fandom's
# thumbnailer serves WebP for every image on every wiki it hosts -- regardless of the
# Accept header, and while its own API declares the file as image/png. That is where
# meme and brainrot characters live, so without this the entire class of characters the
# reference lookup exists for can never have a MEASURED palette. Measured: Omega Lad's
# only artwork is a 407x613 RGBA cut-out we could reach and not decode.
twelvemonkeys_version=3.15.3

# The target, copied from versions/1.21.8.properties when this tree was made (edit THAT file):
# MMVU's Port CI reads it here. build.gradle loads the versions file over it.
minecraft_version=26.2
neo_version=26.2.0.95
