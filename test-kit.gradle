// THE TEST KIT -- a second artifact, never the shipped jar. What a mod built against this one needs to run its own GameTests and corpus tests on the same harness: the GameTest harness and helpers (testing/, minus
// the GameTests that live there), its test-only mixin config, CorpusSource (the corpus switch, from the test classes) and UsesCorpus (the tag on a
// test that reads one).
// Its own file, applied from gate-a.gradle: no GameTest server reads it, so it must never configure a run, jarJar,
// processResources or the minecraft block. Its own folder, not build/libs: Port CI releases every jar in build/libs, and this one is not for players. The ship
// excludes (build.gradle's SHIP_EXCLUDES) are unchanged, so nothing here can reach a player's jar; NEVER_SHIP still checks that on the jar itself.
// Built by every `./gradlew build` (assemble), alone by `./gradlew testKitJar`, or by resolving `testKit` from another build.
configurations { testKit { canBeConsumed = true; canBeResolved = false } }
def testKitJar = tasks.register('testKitJar', Jar) {
    group = 'build'
    description = 'The test kit (#2708 §5): the GameTest harness, testing/ helpers and CorpusSource, as its own jar'
    archiveClassifier = 'testkit'
    destinationDirectory = layout.buildDirectory.dir('test-kit')
    from(sourceSets.main.output) {
        include 'com/moddingfromamod/testing/**', 'gametest/*.gametest.mixins.json'
        exclude '**/?*GameTest.class', '**/?*GameTest$*.class'
    }
    from(sourceSets.test.output) {
        include 'com/moddingfromamod/CorpusSource.class', 'com/moddingfromamod/CorpusSource$*.class',
                'com/moddingfromamod/UsesCorpus.class'
    }
    doLast {
        def names = []
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { z -> z.entries().each { names << it.name } }
        def harness = names.findAll { it.startsWith('com/moddingfromamod/testing/') && it.endsWith('.class') }
        def tests = names.findAll { it ==~ /.*\/[^\/]+GameTest(\$[^\/]*)?\.class$/ }
        if (harness.isEmpty()) throw new GradleException("test kit: no harness classes (testing/) in ${archiveFile.get().asFile}")
        if (!tests.isEmpty()) throw new GradleException("test kit: GameTests are not the harness: ${tests.take(5)}")
        logger.lifecycle("test kit: ${harness.size()} harness classes, CorpusSource " +
                (names.contains('com/moddingfromamod/CorpusSource.class') ? 'included' : 'not in this tree yet') +
                ", ${archiveFile.get().asFile}")
    }
}
artifacts { testKit testKitJar }
tasks.named('assemble') { dependsOn testKitJar }   // so every `./gradlew build` builds and checks it (about a second)

// THE TESTS JAR -- the kit's companion, never the shipped jar. A mod built against this one may extend or call this
// mod's tests: its unit-test classes (a shared helper such as a sweep or a fixture reader), its GameTest classes and the
// test/ package (a GameTest of the other mod that drives one of these), and the public corpus resources those tests read
// off the classpath (src/main/resources/corpus, which a shipped jar never carries). CorpusSource and UsesCorpus are in
// the kit, so they are left out here. Its own folder, build/core-tests/, never build/libs (Port CI releases what is
// there). Built alone by `./gradlew testsJar`; not part of `build`, because only a mod built against this one needs it.
tasks.register('testsJar', Jar) {
    group = 'build'
    description = 'This mod\'s test and GameTest classes and its public corpus, for a mod built against it'
    archiveClassifier = 'coretests'
    destinationDirectory = layout.buildDirectory.dir('core-tests')
    from(sourceSets.test.output) {
        exclude 'com/moddingfromamod/CorpusSource.class', 'com/moddingfromamod/CorpusSource$*.class',
                'com/moddingfromamod/UsesCorpus.class'
    }
    from(sourceSets.main.output) {
        include '**/?*GameTest.class', '**/?*GameTest$*.class', 'com/moddingfromamod/test/**', 'corpus/**'
        exclude 'com/moddingfromamod/testing/**'
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    doLast {
        def n = 0
        new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { z -> z.entries().each { if (it.name.endsWith('.class')) n++ } }
        if (n == 0) throw new GradleException("tests jar: no classes in ${archiveFile.get().asFile}")
        logger.lifecycle("tests jar: ${n} classes, ${archiveFile.get().asFile}")
    }
}
