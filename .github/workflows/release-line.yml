# The release line is main plus port-only commits: code lands on main first.
#
# main holds every change to the code. neoforge-1.21.8 is main at a release point (Port CI builds, gates and releases
# from it) plus port-only commits, and a higher neoforge-<mc> branch holds only its port's own changes plus main merged
# upward. So a fix lands on main FIRST; a hotfix the release line needs before the next release point is cherry-picked
# DOWN from main.
#
# This job refuses a push or pull request that brings neoforge-1.21.8 a commit that changes something other than
# port-only files and has no equivalent on main. Every non-merge commit on the release line that is not reachable from
# main is matched by patch-id against main's commits since that commit forked off main, so a commit reachable from main
# (main fast-forwarded or merged in) and a cherry-pick of a commit that is on main both pass. Merge commits carry no
# patch of their own and are not judged.
#
# Port-only files (the list between the "port-only paths" markers below; tools/test-release-line.py holds it to the
# weekly round's records in MMVU): the Port CI workflows (.github/workflows/port-ci*.yml, regenerated by the kit),
# everything under .port/ (the known-issues ledger included), and README.md when only its Ports block changed. A commit
# that changes only those may be on the release line alone. A commit that mixes them with anything else is judged
# like any other.
#
# Not `git cherry origin/main HEAD`: once main is merged in, the merge-base is main's tip, git cherry has no main commit
# left to compare with, and every older cherry-pick on the line reads as missing from main.
#
# One more exception, Port CI's install-manifest refresh (github-actions[bot], .github/port-install.json alone, after
# a promote). This repository has no install manifest today, so it never happens; the exception keeps a future one
# from failing here.
#
# It reads only. Port CI (port-ci.yml) runs beside it and is not changed: a red check here blocks a pull request, and on
# a push says loudly that the release line has a commit main does not.
name: Release line follows main

on:
  push:
    branches: ["neoforge-1.21.8"]
  pull_request:
    branches: ["neoforge-1.21.8"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  follows-main:
    name: Every release-line commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every release-line commit's patch is on main
        run: |
          set -euo pipefail
          git fetch --no-tags -q origin main
          # A commit that changes only port-only files may be on the release line without being on main. README.md
          # counts only when it is unchanged once the block between the ports markers is taken out of both sides.
          port_only() {
            local sha="$1" f
            local changed; changed="$(git show --name-only --format= "$sha" | sed '/^$/d')"
            [ -n "$changed" ] || return 1
            while IFS= read -r f; do
              # port-only paths: begin
              case "$f" in
                .github/workflows/port-ci*.yml) ;;
                .port/*) ;;
                README.md)
                  python3 - "$sha" <<'PY' || return 1
          import re, subprocess, sys
          sha = sys.argv[1]
          def text(ref):
              r = subprocess.run(["git", "show", ref], capture_output=True, text=True, encoding="utf-8")
              return r.stdout if r.returncode == 0 else ""
          def outside(t):
              t = re.sub(r"<!-- ports:begin -->.*?<!-- ports:end -->", "", t, flags=re.S)
              return t.rstrip()
          sys.exit(0 if outside(text(f"{sha}^:README.md")) == outside(text(f"{sha}:README.md")) else 1)
          PY
                  ;;
                *) return 1 ;;
              esac
              # port-only paths: end
            done <<< "$changed"
          }
          mapfile -t commits < <(git rev-list --no-merges --reverse origin/main..HEAD)
          bad=0
          if [ "${#commits[@]}" -gt 0 ]; then
            since="$(git merge-base origin/main "${commits[0]}")"
            main_ids="$(mktemp)"
            git log -p --no-merges "$since..origin/main" | git patch-id --stable | cut -d' ' -f1 | sort -u > "$main_ids"
            for sha in "${commits[@]}"; do
              id="$(git show --format= -p "$sha" | git patch-id --stable | cut -d' ' -f1)"
              if [ -n "$id" ] && grep -qxF "$id" "$main_ids"; then
                continue
              fi
              author="$(git log -1 --format='%an' "$sha")"
              files="$(git show --name-only --format= "$sha" | sed '/^$/d')"
              if [ "$author" = "github-actions[bot]" ] && [ "$files" = ".github/port-install.json" ]; then
                echo "allowed: $sha is Port CI's install-manifest refresh"
                continue
              fi
              if port_only "$sha"; then
                echo "allowed: $sha changes only port-only files (Port CI workflows, .port/, the README Ports block)"
                continue
              fi
              echo "::error::$(git log -1 --format='%h %s' "$sha") changes code and is on the release line but not on main. Land it on main first, then merge main into the release line or cherry-pick it down. Only port-only files (Port CI workflows, .port/, the README Ports block) may change on the release line alone."
              bad=1
            done
          fi
          if [ "$bad" = 0 ]; then
            echo "Every commit on this release line is on main (by patch) or port-only." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$bad"
