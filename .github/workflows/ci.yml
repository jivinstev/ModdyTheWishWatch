# Moddy the Wish Watch: continuous integration.
#
# Six jobs:
#   changes          what the pull request touches. A PR whose files are ALL in paths no build or test reads
#                    (tools/client-validation/: the scripted client checks of a released jar; .github/port-publish/:
#                    the store page text) runs the scan only; Gate A and Gate B are skipped. Any other file, this
#                    workflow included, runs everything. A docs file is NOT in the list: unit tests read many of them.
#   no-private-work  the leak scan's built-in rules over every tracked file: emails, routable IPs, bucket URLs, keys
#                    and tokens, a child's-data file by its name, and the structural markers of server-side work
#                    that does not belong in this single-player mod; then tools/secret-scan.py over every file and
#                    every commit in the history (the credential shapes of tools/secret_patterns.py). It prints nothing it matched.
#                    Also the hermetic test of tools/refresh-cbscript-bundle.sh (a fixture repo, no network).
#   gate-a           compile, the unit tests, the mod jar and its checks (./gradlew build).
#   gate-b-ci        TARGETED Gate B (docs/GATE_B.md): the `ci` shard, plus every GameTest the change can reach by
#                    tools/gate/gate.py select (the coverage map on the gate-map branch, the tests naming a changed
#                    class, the unplaced), or the whole tier when the change is one the map cannot see. It prints each
#                    class it chose and why. Counted, a failure retried once by itself; its result is kept as the
#                    gate-run-record artifact, which the nightly records.
#   gate-b-tier      the whole default tier (`ci,default`) on one runner, when started by hand. The nightly
#                    (nightly.yml, docs/GATE_B.md) runs the same tier on main every night, split across runners.
#   rig-films        Gate C's rig films (tools/gate-c-rig.sh: a real client under Xvfb filming each creature take, a
#                    failed film re-run once, FLAKY red). Only on a pull request that touches what they measure
#                    (`tools/rig-films.py --needed`: the atom rig, the films, the sculpt tool, the creature lesson, the
#                    starter species), or by hand (Run workflow, rig_films). ~35-50 minutes, so never on every PR.
#
# Pull requests run it (every pull request to main gets the leak scan, Gate A and the ci shard: what a PR merges on).
# Pushes to main do not, for now: the repo has little Actions quota, so the default tier runs only when started by hand
# (Actions → CI → Run workflow). The first run (2026-11-18) passed the leak scan, Gate A and the ci shard.
#
# A push to main also writes the Gradle cache that every pull request restores (a pull_request run may read only its
# own cache and its base branch's), so without the push trigger each PR pays the cold Minecraft decompile (~9 minutes
# instead of ~3). Turning push back on buys warm PRs for one run per merge.
name: CI

on:
  pull_request:
    branches: [main]
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      rig_films:
        description: "Also run the rig films (Gate C, ~35-50 minutes)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      rig: ${{ steps.classify.outputs.rig }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "rig=${{ inputs.rig_films == true }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...HEAD")"
          printf '%s\n' "$files"
          # The rig films are required when the change touches what they measure (tools/rig-films.py --needed).
          # shellcheck disable=SC2086
          if [ "$(python3 tools/rig-films.py --paths $files)" = "rig-films" ]; then
            echo "rig=true" >> "$GITHUB_OUTPUT"
          else
            echo "rig=false" >> "$GITHUB_OUTPUT"
          fi
          # Paths no build, unit test or game test reads. Keep this list short and literal.
          other="$(printf '%s\n' "$files" | grep -v -E '^(tools/client-validation/|\.github/port-publish/)' | grep -v '^$' || true)"
          if [ -z "$other" ]; then
            echo "Only scripted client checks or store page text changed: the scan runs, Gate A and Gate B are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  no-private-work:
    name: No private work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The leak scan's rules can still go red
        run: python3 tools/test-leak-scan.py
      - name: Scan every tracked file
        run: python3 tools/leak-scan.py --tree
      - name: The secret scanner's rules can still go red
        run: python3 tools/test-secret-scan.py
      - name: No API key or token in any tracked file, or in any commit of the history
        run: |
          git fetch --quiet --unshallow || true
          python3 tools/secret-scan.py --tree
          python3 tools/secret-scan.py --history
      - name: The compiler bundle's refresh tool still builds, records and refuses
        run: python3 tools/test-refresh-cbscript-bundle.py

  gate-a:
    name: Gate A (build and unit tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - &gradle-cache
        # ModDevGradle's NeoForm runtime keeps the Minecraft decompile in ~/.gradle/caches/neoformruntime.
        name: Cache Gradle and the NeoForm decompile
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle', 'versions/*.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - &ply
        name: The datapack compiler's Python dependency
        run: python3 -m pip install --break-system-packages ply
      - name: ./gradlew build
        run: ./gradlew build --console=plain
      - name: The gate tools' own rules (tools/gate/test_gate.py, docs/GATE_B.md)
        run: python3 tools/gate/test_gate.py
      - name: The rig films' rules (which films, when; the part-drift check can still go red)
        run: |
          python3 tools/rig-films.py --self-test
          python3 tools/rig-films.py --check
          python3 tools/test-rig-drift.py
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gate-a-reports
          path: build/reports/tests/
          retention-days: 7

  gate-b-ci:
    name: Gate B (targeted)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - *gradle-cache
      - *ply
      - name: Choose the GameTests this change can reach (tools/gate/gate.py select, docs/GATE_B.md)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request: the ci shard, as before."
            : > classes.txt; echo "ci" > shard.txt
            exit 0
          fi
          # the PR's own head against main as it is now: main's commits merged into the branch are not its changes
          git fetch --quiet origin "$BASE_REF"
          if git fetch --quiet --depth=1 origin gate-map; then
            git show FETCH_HEAD:map.json.gz > covmap.json.gz || rm -f covmap.json.gz
          fi
          python3 tools/gate/gate.py select --base "origin/$BASE_REF" --head "$HEAD_SHA" --map covmap.json.gz \
            --out selection.json --classes-out classes.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ci,default" > shard.txt
      - name: Run them (counted; a failure is retried once, by itself)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/gate/gate.py run --shard "$(cat shard.txt)" --classes-file classes.txt \
            --kind pr --label "pr-${PR:-none}" --timeout 80 --out gate-job
      - name: Keep the result (the nightly records it, docs/GATE_B.md "Run history")
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gate-run-record
          path: |
            gate-job/job.json
            selection.json
          retention-days: 14
          if-no-files-found: ignore

  gate-b-tier:
    name: Gate B (the default tier)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHARD: ci,default
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - *gradle-cache
      - *ply
      - name: Run the game tests (counted; a failure is retried once, by itself)
        run: python3 tools/gate/gate.py run --shard "$SHARD" --kind dispatch --label tier --timeout 80 --out gate-job

  rig-films:
    name: Gate C (the rig films)
    needs: changes
    if: needs.changes.outputs.rig == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - *gradle-cache
      - *ply
      - name: A virtual display and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils
      - name: Every rig film the scoreboard names
        run: |
          python3 tools/rig-films.py --check
          ./tools/gate-c-rig.sh
      - name: Film logs and frames
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rig-films
          path: /tmp/moddingfromamod-gate-c-rig/
          retention-days: 7
